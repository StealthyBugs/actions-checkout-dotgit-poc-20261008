name: PR source

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Record the unprivileged source run
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "head_repository=${{ github.event.pull_request.head.repo.full_name }}"
          echo "head_ref=${{ github.event.pull_request.head.ref }}"
          echo "head_sha=${{ github.event.pull_request.head.sha }}"

