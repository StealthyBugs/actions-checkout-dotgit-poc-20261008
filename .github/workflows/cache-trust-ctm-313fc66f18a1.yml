name: Cache trust ctm-313fc66f18a1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      key:
        required: false
        type: string
      marker:
        required: false
        type: string
      expected_sha:
        required: false
        type: string
      restore_keys:
        required: false
        type: string
      case:
        required: false
        type: string

permissions:
  contents: read

jobs:
  base-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'base_seed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare base exact
        shell: bash
        env:
          MARKER: "ctm-313fc66f18a1-marker-base_exact-8408d2e068"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base exact
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-313fc66f18a1-base-exact"
      - name: Prepare base case
        shell: bash
        env:
          MARKER: "ctm-313fc66f18a1-marker-base_case-fd125583c8"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
