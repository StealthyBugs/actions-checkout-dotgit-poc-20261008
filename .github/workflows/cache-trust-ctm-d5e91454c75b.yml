name: Cache trust ctm-d5e91454c75b

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      key:
        required: false
        type: string
      marker:
        required: false
        type: string
      expected_sha:
        required: false
        type: string
      restore_keys:
        required: false
        type: string
      case:
        required: false
        type: string

permissions:
  contents: read

jobs:
  base-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'base_seed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare base exact
        shell: bash
        env:
          MARKER: "ctm-d5e91454c75b-marker-base_exact-fa6a34a252"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base exact
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-d5e91454c75b-base-exact"
      - name: Prepare base case
        shell: bash
        env:
          MARKER: "ctm-d5e91454c75b-marker-base_case-ff3bc6a35f"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base case
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-d5e91454c75b-base-CaseFold"
      - name: Prepare base unicode
        shell: bash
        env:
          MARKER: "ctm-d5e91454c75b-marker-base_unicode-59283fd1ca"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base unicode
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-d5e91454c75b-base-unicod\u00e9"
      - name: Prepare base prefix
        shell: bash
        env:
          MARKER: "ctm-d5e91454c75b-marker-base_prefix-70ffabd6d6"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base prefix
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-d5e91454c75b-base-prefix-leaf"

  base-verify:
    needs: base-seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base_exact
            key: "ctm-d5e91454c75b-base-exact"
            restore_keys: ""
            expected_sha: 043e7502234fb084f495bd9683b9acef5623a16978d189b94a98d29dc92670a0
          - case: base_casefold_miss
            key: "ctm-d5e91454c75b-base-casefold"
            restore_keys: ""
            expected_sha: dab8a3eeed7d0da05b6c39a0923a32ac4de3a341425454d312a3cc8c76aad1f3
          - case: base_unicode_miss
