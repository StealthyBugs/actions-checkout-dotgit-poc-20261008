name: Cache reusable consumer
on:
  workflow_call:
    inputs:
      key:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
jobs:
  reusable-consume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: rm -rf "$RUNNER_TEMP/cache-boundary"
      - id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: ${{ inputs.key }}
      - if: always()
        shell: bash
        env:
          CASE: reusable_callee_base_exact
          CACHE_KEY: ${{ inputs.key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"cache-boundary"/"marker"
          raw=p.read_bytes() if p.exists() and p.is_file() else b""
          present=bool(raw)
          actual=hashlib.sha256(raw).hexdigest() if present else None
          expected=os.environ.get("EXPECTED_SHA") or None
          out={"schema":"cache-trust-result/v1","case":os.environ["CASE"],"cache_hit":os.environ.get("CACHE_HIT","") or "","present":present,"file_sha256":actual,"expected_sha256":expected,"expected_match":bool(present and expected and actual==expected),"key_sha256":hashlib.sha256(os.environ["CACHE_KEY"].encode()).hexdigest(),"event":os.environ["GITHUB_EVENT_NAME"],"ref_sha256":hashlib.sha256(os.environ["GITHUB_REF"].encode()).hexdigest(),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"raw_bytes_retained":False,"restored_bytes_executed":False}
          print("CACHE_RESULT "+json.dumps(out,sort_keys=True,separators=(",",":")))
          PY
