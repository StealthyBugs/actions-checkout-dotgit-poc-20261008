name: Cache trust ctr-5f8e6a40e62a

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      key:
        required: false
        type: string
      marker:
        required: false
        type: string
      expected_sha:
        required: false
        type: string
      restore_keys:
        required: false
        type: string
      case:
        required: false
        type: string

permissions:
  contents: read

jobs:
  base-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'base_seed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare base exact
        shell: bash
        env:
          MARKER: "ctr-5f8e6a40e62a-marker-base_exact-e932afb958"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base exact
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctr-5f8e6a40e62a-base-exact"
      - name: Prepare base case
        shell: bash
        env:
          MARKER: "ctr-5f8e6a40e62a-marker-base_case-0d0e03457e"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base case
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctr-5f8e6a40e62a-base-CaseFold"
      - name: Prepare base unicode
        shell: bash
        env:
          MARKER: "ctr-5f8e6a40e62a-marker-base_unicode-23aa77e859"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base unicode
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctr-5f8e6a40e62a-base-unicod\u00e9"
      - name: Prepare base prefix
        shell: bash
        env:
          MARKER: "ctr-5f8e6a40e62a-marker-base_prefix-13aead8d18"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base prefix
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctr-5f8e6a40e62a-base-prefix-leaf"

  base-verify:
    needs: base-seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base_exact
            key: "ctr-5f8e6a40e62a-base-exact"
            restore_keys: ""
            expected_sha: bdd26530ab5752c34148d4f7571f963a3bb7dd32be49e0b3b9e909127c791d57
