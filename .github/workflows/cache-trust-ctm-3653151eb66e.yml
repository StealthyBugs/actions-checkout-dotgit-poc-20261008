    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'base_seed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare base exact
        shell: bash
        env:
          MARKER: "ctm-3653151eb66e-marker-base_exact-c046d613fb"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base exact
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-3653151eb66e-base-exact"
