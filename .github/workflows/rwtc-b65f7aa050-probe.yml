name: Same-repo token probe
on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      target_run:
        required: false
        type: string
      event_type:
        required: true
        type: string
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Benign permission probes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
          TARGET_RUN: ${{ inputs.target_run }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,re,urllib.error,urllib.parse,urllib.request
          token=os.environ["GH_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          owner=repo.split("/",1)[0]
          api="https://api.github.com"
          label=os.environ["LABEL"]
          target=os.environ.get("TARGET_RUN","")
          event_type=os.environ["EVENT_TYPE"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2026-03-10","User-Agent":"reusable-token-ceiling"}
          def call(method,path,body=None):
              raw=json.dumps(body,separators=(",",":")).encode() if body is not None else None
              hs=dict(headers)
              if raw is not None: hs["Content-Type"]="application/json"
              req=urllib.request.Request(api+path,data=raw,headers=hs,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: data=r.read(); status=r.status; rid=r.headers.get("X-GitHub-Request-Id","")
              except urllib.error.HTTPError as e: data=e.read(); status=e.code; rid=e.headers.get("X-GitHub-Request-Id","")
              try: value=json.loads(data) if data else None
              except Exception: value=None
              return status,value,hashlib.sha256(rid.encode()).hexdigest()
          out={"schema":"reusable-token-ceiling-result/v1","label":label,"event":os.environ["GITHUB_EVENT_NAME"],"repository_sha256":hashlib.sha256(repo.encode()).hexdigest(),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"token_raw_retained":False,"token_value_printed":False}
          request_hashes={}
          status,_,rid=call("POST",f"/repos/{repo}/dispatches",{"event_type":event_type,"client_payload":{"marker_sha256":hashlib.sha256(label.encode()).hexdigest()}}); out["dispatch_status"]=status; request_hashes["dispatch"]=rid
          status,blob,rid=call("POST",f"/repos/{repo}/git/blobs",{"content":"inert-token-ceiling-"+label,"encoding":"utf-8"}); out["blob_status"]=status; request_hashes["blob"]=rid
          temp_ref=None; temp_commit=None
          if status==201 and isinstance(blob,dict) and blob.get("sha"):
              s,ref,rid=call("GET",f"/repos/{repo}/git/ref/heads/main"); request_hashes["main_ref"]=rid
              main_sha=((ref or {}).get("object") or {}).get("sha") if s==200 else None
              s,commit,rid=call("GET",f"/repos/{repo}/git/commits/{main_sha}"); request_hashes["main_commit"]=rid
              tree_sha=((commit or {}).get("tree") or {}).get("sha") if s==200 else None
              s,tree,rid=call("POST",f"/repos/{repo}/git/trees",{"base_tree":tree_sha,"tree":[{"path":".token-ceiling/"+re.sub(r"[^a-zA-Z0-9_.-]","-",label)+".txt","mode":"100644","type":"blob","sha":blob["sha"]}]}); request_hashes["tree"]=rid
              new_tree=(tree or {}).get("sha") if s==201 else None
              s,new_commit,rid=call("POST",f"/repos/{repo}/git/commits",{"message":"Inert reusable-token ceiling probe","tree":new_tree,"parents":[main_sha]}); request_hashes["commit"]=rid
              temp_commit=(new_commit or {}).get("sha") if s==201 else None
              temp_ref="refs/heads/rwtc-"+os.environ["GITHUB_RUN_ID"]+"-"+re.sub(r"[^a-zA-Z0-9-]","-",label)[:35]
              s,_,rid=call("POST",f"/repos/{repo}/git/refs",{"ref":temp_ref,"sha":temp_commit}); out["ref_status"]=s; request_hashes["ref"]=rid
          else: out["ref_status"]=None
          out["temp_ref"]=temp_ref; out["temp_commit"]=temp_commit
          if target:
              s,_,rid=call("POST",f"/repos/{repo}/actions/runs/{target}/rerun"); out["rerun_status"]=s; request_hashes["rerun"]=rid
          else: out["rerun_status"]=None
          package_name="rwtc-nonexistent-"+hashlib.sha256(label.encode()).hexdigest()[:10]
          s,_,rid=call("DELETE",f"/users/{owner}/packages/container/{package_name}"); out["package_status"]=s; request_hashes["package"]=rid
          oidc_url=os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL"); oidc_token=os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          out["oidc_env_present"]=bool(oidc_url and oidc_token); out["oidc_status"]=None; out["oidc_claim_hashes"]={}
          if oidc_url and oidc_token:
              sep="&" if "?" in oidc_url else "?"
              req=urllib.request.Request(oidc_url+sep+urllib.parse.urlencode({"audience":"rwtc-"+hashlib.sha256(label.encode()).hexdigest()[:12]}),headers={"Authorization":"Bearer "+oidc_token,"User-Agent":"reusable-token-ceiling"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: data=json.loads(r.read()); out["oidc_status"]=r.status
                  jwt=data.get("value",""); middle=jwt.split(".")[1]; claims=json.loads(base64.urlsafe_b64decode(middle+"="*((4-len(middle)%4)%4)))
                  out["oidc_claim_hashes"]={k:hashlib.sha256(str(claims.get(k,"")).encode()).hexdigest() for k in ("iss","sub","aud","repository_id","repository_owner_id")}
              except urllib.error.HTTPError as e: out["oidc_status"]=e.code
              except Exception: out["oidc_status"]=-1
          sarif=base64.b64encode(gzip.compress(b"{}" )).decode()
          s,sarif_value,rid=call("POST",f"/repos/{repo}/code-scanning/sarifs",{"commit_sha":os.environ["GITHUB_SHA"],"ref":"refs/heads/main","sarif":sarif,"tool_name":"rwtc-noop"}); out["sarif_status"]=s; request_hashes["sarif"]=rid; out["sarif_id"]=(sarif_value or {}).get("id") if isinstance(sarif_value,dict) else None
          out["request_id_hashes"]=request_hashes
          print("TOKEN_RESULT "+json.dumps(out,sort_keys=True,separators=(",",":")))
          PY
