name: Cache trust ctm-f8b3712ce6c9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, edited, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      key:
        required: false
        type: string
      marker:
        required: false
        type: string
      expected_sha:
        required: false
        type: string
      restore_keys:
        required: false
        type: string
      case:
        required: false
        type: string

permissions:
  contents: read

jobs:
  base-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'base_seed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare base exact
        shell: bash
        env:
          MARKER: "ctm-f8b3712ce6c9-marker-base_exact-1fce3ffa45"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base exact
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-f8b3712ce6c9-base-exact"
      - name: Prepare base case
        shell: bash
        env:
          MARKER: "ctm-f8b3712ce6c9-marker-base_case-3ae3185e48"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base case
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-f8b3712ce6c9-base-CaseFold"
      - name: Prepare base unicode
        shell: bash
        env:
          MARKER: "ctm-f8b3712ce6c9-marker-base_unicode-679e98b113"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base unicode
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-f8b3712ce6c9-base-unicod\u00e9"
      - name: Prepare base prefix
        shell: bash
        env:
          MARKER: "ctm-f8b3712ce6c9-marker-base_prefix-547cacb1bb"
        run: |
          rm -rf "$RUNNER_TEMP/cache-boundary"
          mkdir -p "$RUNNER_TEMP/cache-boundary"
          printf '%s' "$MARKER" > "$RUNNER_TEMP/cache-boundary/marker"
      - name: Save base prefix
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/cache-boundary
          key: "ctm-f8b3712ce6c9-base-prefix-leaf"

  base-verify:
    needs: base-seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base_exact
            key: "ctm-f8b3712ce6c9-base-exact"
            restore_keys: ""
            expected_sha: 7357c7ab24af89f508b40915e37c6600ac7473b2f056e4e5d8f0deae25945f1d
          - case: base_casefold_miss
            key: "ctm-f8b3712ce6c9-base-casefold"
            restore_keys: ""
            expected_sha: c5149ff6e51a54fb44d0156b73514c7700534f8f2fcf7c3732c4f61cf3e86cb4
          - case: base_unicode_miss
